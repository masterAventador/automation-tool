name: Desktop matrix

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - backend/automation-tool-executor.spec
      - backend/pyproject.toml
      - backend/uv.lock
      - backend/src/automation_tool/**
      - backend/tests/integration/test_executor_manifest_cli.py
      - backend/tests/integration/test_packaged_browser_probe.py
      - backend/tests/integration/test_pyinstaller_bundle.py
      - backend/tests/fixtures/packaged_browser_probe.py
      - backend/tests/unit/executor/test_package_manifest.py
      - backend/tests/unit/executor/test_macos_candidate.py
      - backend/tests/unit/executor/test_windows_candidate.py
      - backend/tests/unit/executor/test_process_cli.py
      - backend/tests/unit/executor/test_pyinstaller_bundle_contract.py
      - scripts/run_p9_01_acceptance.py
      - scripts/run_p9_02_acceptance.py
      - scripts/run_p9_04_acceptance.py
      - scripts/run_p9_05_acceptance.py
      - contracts/fixtures/executor-package-v1/**
      - contracts/protocol/executor-package-manifest-v1.schema.json
      - contracts/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - frontend/**
      - backend/automation-tool-executor.spec
      - backend/pyproject.toml
      - backend/uv.lock
      - backend/src/automation_tool/**
      - backend/tests/integration/test_executor_manifest_cli.py
      - backend/tests/integration/test_packaged_browser_probe.py
      - backend/tests/integration/test_pyinstaller_bundle.py
      - backend/tests/fixtures/packaged_browser_probe.py
      - backend/tests/unit/executor/test_package_manifest.py
      - backend/tests/unit/executor/test_macos_candidate.py
      - backend/tests/unit/executor/test_windows_candidate.py
      - backend/tests/unit/executor/test_process_cli.py
      - backend/tests/unit/executor/test_pyinstaller_bundle_contract.py
      - scripts/run_p9_01_acceptance.py
      - scripts/run_p9_02_acceptance.py
      - scripts/run_p9_04_acceptance.py
      - scripts/run_p9_05_acceptance.py
      - contracts/fixtures/executor-package-v1/**
      - contracts/protocol/executor-package-manifest-v1.schema.json
      - contracts/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  executor-bundle:
    name: ${{ matrix.runner }} / Executor onedir smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12.13
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable-2026-07-18
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: frontend/src-tauri -> target
      - run: uv sync --locked --dev
      - name: Build and start the PyInstaller onedir Executor
        env:
          AUTOMATION_TOOL_ALLOW_VISIBLE_BROWSER_TESTS: "1"
        run: >-
          uv run pytest
          tests/unit/executor/test_package_manifest.py
          tests/unit/executor/test_process_cli.py
          tests/unit/executor/test_pyinstaller_bundle_contract.py
          tests/integration/test_executor_manifest_cli.py
          tests/integration/test_pyinstaller_bundle.py
          tests/integration/test_packaged_browser_probe.py
          -q
      - name: Build and audit the macOS Executor candidate
        if: runner.os == 'macOS'
        run: uv run python ../scripts/run_p9_01_acceptance.py
      - name: Build and audit the Windows Executor candidate
        if: runner.os == 'Windows'
        run: uv run python ../scripts/run_p9_02_acceptance.py
      - name: Build and audit the Windows Tauri candidate
        if: runner.os == 'Windows'
        run: uv run python ../scripts/run_p9_04_acceptance.py

  desktop:
    name: ${{ matrix.runner }} / build and smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.0.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12.13
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable-2026-07-18
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: frontend/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:api
      - run: pnpm test:rust
      - name: Build and audit an ephemeral production binary
        run: python ../scripts/run_e4_15_acceptance.py
      - name: Run the real Tauri desktop smoke test
        run: pnpm test:tauri
      - name: Restore and verify production frontend assets
        run: pnpm check:production-boundaries
