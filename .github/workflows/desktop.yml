name: Desktop matrix

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - contracts/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - frontend/**
      - contracts/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  desktop:
    name: ${{ matrix.runner }} / build and smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.0.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable-2026-07-18
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: frontend/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:api
      - run: pnpm test:rust
      - name: Build production desktop binary without a test driver
        run: pnpm tauri build --debug --no-bundle
      - name: Run the real Tauri desktop smoke test
        run: pnpm test:tauri
      - name: Restore and verify production frontend assets
        run: pnpm check:production-boundaries
