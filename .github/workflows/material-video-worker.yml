name: Material video Worker package

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/material-video-worker.yml"
      - "contracts/quality/material-video-worker-package.v1.json"
      - "contracts/security/material-video-gateway.v1.json"
      - "frontend/src-tauri/src/local_video_orchestrator.rs"
      - "frontend/src-tauri/tests/material_video_gateway.rs"
      - "workers/material_montage/**"
      - "scripts/build_material_video_worker_candidate.py"
      - "scripts/test_material_video_worker.py"
      - "scripts/run_im_02_acceptance.py"
      - "scripts/run_im_03_acceptance.py"
      - "vendor/moneyprinterturbo"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} frozen package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: vendor/moneyprinterturbo/uv.lock
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable-2026-07-18
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: frontend/src-tauri -> target
      - run: uv python install 3.11.15
      - run: python scripts/run_im_03_acceptance.py
