[project]
name = "automation-tool"
version = "0.1.0"
description = "Control Plane and Local Executor for the automation-tool desktop product"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "argon2-cffi>=25.1.0,<26",
    "asyncpg",
    "cryptography",
    "fastapi",
    "playwright",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
    "websockets",
]

[project.scripts]
automation-tool-control-plane = "automation_tool.control_plane.bootstrap.cli:main"
automation-tool-build-executor-manifest = "automation_tool.executor.package_manifest:main"
automation-tool-build-macos-executor = "automation_tool.executor.macos_candidate:main"
automation-tool-build-windows-executor = "automation_tool.executor.windows_candidate:main"
automation-tool-executor = "automation_tool.executor.cli:main"
automation-tool-export-executor-schema = "automation_tool.protocol.schema:main"
automation-tool-export-openapi = "automation_tool.control_plane.bootstrap.openapi:main"
automation-tool-account-operations = "automation_tool.control_plane.bootstrap.account_operations_cli:main"
automation-tool-revoke-installation = "automation_tool.control_plane.bootstrap.revoke_installation_cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2",
    "jsonschema",
    "mypy",
    "pyinstaller>=6.21.0",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "types-jsonschema",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_mode = "strict"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["automation_tool"]
# This module is exercised by the native Windows runner; importing Win32 DLLs is
# intentionally impossible on the Linux backend coverage runner.
omit = ["src/automation_tool/executor/windows_acl.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
