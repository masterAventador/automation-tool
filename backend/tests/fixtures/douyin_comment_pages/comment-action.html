<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8" /></head>
  <body>
    <main>
      <textarea aria-label="留下你的精彩评论"></textarea>
      <button aria-label="发表评论" type="button">发表评论</button>
      <div role="status" hidden>评论成功</div>
    </main>
    <script>
      document.querySelector("button").addEventListener("click", () => {
        document.querySelector('[role="status"]').hidden = false;
      });
    </script>
  </body>
</html>
