[package]
name = "automation-tool-desktop"
version = "0.1.0"
description = "Desktop client for the automation-tool product"
authors = ["automation-tool contributors"]
edition = "2021"
rust-version = "1.88"

[features]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "automation_tool_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
zeroize = "=1.9.0"
uuid = { version = "=1.24.0", default-features = false }

[dev-dependencies]
serde_json = "1.0.149"
