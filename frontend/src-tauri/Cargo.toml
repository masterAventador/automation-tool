[package]
name = "automation-tool-desktop"
version = "0.1.0"
description = "Desktop client for the automation-tool product"
authors = ["automation-tool contributors"]
edition = "2021"
rust-version = "1.88"

[features]
desktop-test-driver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
desktop-e2e = ["desktop-test-driver"]
control-plane-e2e = ["desktop-test-driver"]

[lib]
name = "automation_tool_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
hmac = { version = "=0.13.0", features = ["zeroize"] }
regex = "=1.13.1"
reqwest = { version = "=0.13.4", features = ["json"] }
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
time = { version = "=0.3.53", features = ["parsing"] }
zeroize = "=1.9.0"
uuid = { version = "=1.24.0", default-features = false }
walkdir = "=2.5.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework = { version = "=3.7.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_SystemServices",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
