[package]
name = "automation-tool-desktop"
version = "0.1.0"
description = "Desktop client for the automation-tool product"
authors = ["automation-tool contributors"]
edition = "2021"
rust-version = "1.88"

[features]
desktop-test-driver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
desktop-e2e = ["desktop-test-driver"]
control-plane-e2e = ["desktop-test-driver"]

[lib]
name = "automation_tool_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.4", features = ["json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
time = { version = "=0.3.53", features = ["parsing"] }
zeroize = "=1.9.0"
uuid = { version = "=1.24.0", default-features = false }
